name: Handle Showcase Submission
on:
  issues:
    types: [opened, reopened]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SHOWCASE_PR_TOKEN }}

      - name: Parse issue and append entry
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 << 'EOF'
          import yaml, os, re

          body = os.environ["ISSUE_BODY"]

          if "### GitHub Username" not in body:
              print("Not a showcase submission; skipping.")
              raise SystemExit(0)

          def extract(label):
              match = re.search(rf"### {label}\s*\n+(.+)", body)
              return match.group(1).strip() if match else ""

          username = extract("GitHub Username")
          dotfiles = extract("Dotfiles URL")
          tags_raw = extract("Tags")
          tags = [t.strip() for t in tags_raw.split(",") if t.strip()] if tags_raw else []

          if not username or not dotfiles:
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("valid=false\n")
              raise SystemExit(0)

          class InlineList(list):
              pass
          class BlockDumper(yaml.Dumper):
              pass
          def represent_inline_list(dumper, data):
              return dumper.represent_sequence("tag:yaml.org,2002:seq", data, flow_style=True)
          BlockDumper.add_representer(InlineList, represent_inline_list)

          with open("entries.yml", "r") as f:
              entries = yaml.safe_load(f.read()) or []

          if any(e.get("username") == username for e in entries):
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("valid=false\n")
                  fh.write("reason=duplicate\n")
              raise SystemExit(0)

          for entry in entries:
              entry["tags"] = InlineList(entry.get("tags") or [])

          entries.append({
              "username": username,
              "dotfiles": dotfiles,
              "tags": InlineList(tags),
          })

          with open("entries.yml", "w") as f:
              yaml.dump(entries, f, Dumper=BlockDumper, default_flow_style=False, allow_unicode=True, sort_keys=False)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("valid=true\n")
              fh.write(f"username={username}\n")
          EOF

      - name: Comment on invalid submission
        if: steps.parse.outputs.valid == 'false'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.SHOWCASE_PR_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for submitting! Unfortunately this submission could not be processed — either required fields are missing or this username is already in the showcase.

            Please check your submission and open a new issue if needed.

      - name: Close invalid issue
        if: steps.parse.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SHOWCASE_PR_TOKEN }}
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })

      - name: Create Pull Request
        if: steps.parse.outputs.valid == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SHOWCASE_PR_TOKEN }}
          branch: showcase/${{ steps.parse.outputs.username }}
          commit-message: "showcase: add ${{ steps.parse.outputs.username }}"
          title: "showcase: add ${{ steps.parse.outputs.username }}"
          body: |
            Submitted via issue #${{ github.event.issue.number }}
          labels: submission

      - name: Comment with PR link
        if: steps.parse.outputs.valid == 'true'
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.SHOWCASE_PR_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks! A PR has been opened for your submission. It will be reviewed shortly.
