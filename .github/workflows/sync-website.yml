name: Sync website

on:
  push:
    branches: [main]
    paths:
      - entries.yml

permissions:
  contents: write

concurrency:
  group: sync-entries
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Add timestamps
        id: timestamps
        run: python .github/scripts/showcase.py timestamps

      - name: Commit & push timestamps
        if: steps.timestamps.outputs.changed == 'true'
        env:
          USERNAMES: ${{ steps.timestamps.outputs.usernames }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries.yml
          git commit -m "chore: add entry timestamps for ${USERNAMES}"
          git push

      - name: Dispatch website rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SHOWCASE_SYNC_TOKEN }}
          repository: mangowm/mangowm.github.io
          event-type: showcase-updated
