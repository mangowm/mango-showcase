name: Showcase Submission
description: Submit your desktop to the mango showcase
title: "showcase: <your-username>"
labels: ["submission"]
body:
  - type: input
    id: dotfiles
    attributes:
      label: Dotfiles URL
      description: Must be a public repository.
      placeholder: https://github.com/your-username/dotfiles
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: >
        Optional. Comma-separated keywords that describe your setup —
        e.g. `dark`, `minimal`.
      placeholder: dark, minimal
    validations:
      required: false
