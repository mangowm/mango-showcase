name: Showcase Submission
description: Submit your setup to the mango showcase
title: "showcase: <username>"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Your dotfiles repo needs at least one **screenshot or video** in a `showcase/` directory:

        | Type | Single file | Multiple files |
        |------|-------------|----------------|
        | **Screenshots** | `showcase/image.png` | `showcase/images/1.png`, `2.png`, ... |
        | **Videos** | `showcase/video.mp4` | `showcase/videos/1.mp4`, `2.mp4`, ... |

        > Submissions without media are closed automatically.

  - type: input
    id: dotfiles
    attributes:
      label: Dotfiles URL
      description: A public repository on GitHub.
      placeholder: https://github.com/<username>/<repo>
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags
      description: "Optional. Comma-separated keywords that describe your setup, for example `dark, minimal`."
      placeholder: dark, minimal
    validations:
      required: false
